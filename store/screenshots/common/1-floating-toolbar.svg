  <text x="120" y="312" font-family="'Malgun Gothic','Segoe UI',system-ui,sans-serif" font-size="16" fill="#cfd3da">…then run the action you want, instantly.</text>

  <!-- toolbar list -->
  <g transform="translate(124,300)">
