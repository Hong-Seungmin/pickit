  <text x="120" y="240" font-family="'Malgun Gothic','Segoe UI',system-ui,sans-serif" font-size="16" fill="#cfd3da">Drag to select any phrase…</text>
  <rect x="120" y="258" width="430" height="22" rx="3" fill="rgba(79,109,245,.45)"/>
