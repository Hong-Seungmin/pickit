<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#0b1020"/>
  <rect width="1280" height="800" fill="url(#g)"/>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#141a33"/><stop offset="1" stop-color="#0b1020"/>
  </linearGradient></defs>
  
  <text x="640" y="86" text-anchor="middle" font-family="'Malgun Gothic','Segoe UI',system-ui,sans-serif" font-size="40" font-weight="800" fill="#ffffff">A floating toolbar — the instant you select text</text>
  <rect x="80" y="150" width="1120" height="570" rx="14" fill="#171a23" stroke="#2a3040"/>
  <rect x="80" y="150" width="1120" height="44" rx="14" fill="#1f2430"/>
  <rect x="80" y="178" width="1120" height="16" fill="#1f2430"/>
  <circle cx="108" cy="172" r="6" fill="#ef5f5f"/><circle cx="128" cy="172" r="6" fill="#f6c150"/><circle cx="148" cy="172" r="6" fill="#56c264"/>
